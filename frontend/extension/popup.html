<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HypePool</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #080808;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e1e1e;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .logo-hp {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: -0.04em;
      color: #00e676;
    }

    .logo-text {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: -0.04em;
      color: #fff;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #00e676;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      padding: 12px 16px 6px;
    }

    .current-page {
      padding: 10px 16px;
      border-bottom: 1px solid #1e1e1e;
    }

    .page-url {
      font-size: 10px;
      color: #444;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .page-url span {
      color: #00e676;
      font-weight: 700;
    }

    .stake-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: #00e676;
      color: #000;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .stake-btn:hover { background: #00c853; }

    .stake-btn.disabled {
      background: #1e1e1e;
      color: #444;
      cursor: default;
    }

    .stake-btn .dot {
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
    }

    .recent-pool {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #1e1e1e;
      text-decoration: none;
    }

    .recent-pool:hover { background: #0e0e0e; }

    .pool-title {
      font-size: 11px;
      color: #fff;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }

    .pool-age {
      font-size: 9px;
      color: #444;
    }

    .empty-state {
      padding: 20px 16px;
      text-align: center;
      color: #333;
      font-size: 11px;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #1e1e1e;
      display: flex;
      gap: 8px;
    }

    .footer a {
      font-size: 10px;
      color: #444;
      text-decoration: none;
    }

    .footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="logo-hp">HP</span>
      <span class="logo-text">HypePool</span>
    </div>
    <div class="live-dot" title="Extension active"></div>
  </div>

  <div id="current-section">
    <div class="section-label">Current Page</div>
    <div class="current-page">
      <div class="page-url" id="page-url">Not on a supported video page</div>
      <button class="stake-btn disabled" id="stake-btn">
        <span class="dot"></span>
        Stake on HypePool
      </button>
    </div>
  </div>

  <div id="recent-section">
    <div class="section-label">Recent Pools</div>
    <div id="recent-list">
      <div class="empty-state">No pools staked yet</div>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:3000/app" target="_blank">Open App</a>
    <a href="http://localhost:3000/app/submit" target="_blank">Submit Pool</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
